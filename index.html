<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Picker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>🍽️ Restaurant Picker</h1>

<label>Radius: <span id="radiusValue">5</span> km</label>
<input type="range" id="radius" min="1" max="15" value="5">

<label>Küche</label>
<select id="cuisine">
<option value="">Alle</option>
<option value="italian">Italienisch</option>
<option value="greek">Griechisch</option>
<option value="asian">Asiatisch</option>
<option value="burger">Burger</option>
<option value="pizza">Pizza</option>
</select>

<button id="loadBtn">Restaurants laden</button>
<button id="recommendBtn">🎲 Neue Empfehlung</button>

<div id="recommendation"></div>

<h2>🟢 Geöffnet</h2>
<ul id="openList"></ul>

<h2>❓ Öffnungszeiten unbekannt</h2>
<ul id="unknownList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
