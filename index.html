<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Picker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🍽️ Restaurant Picker</h1>

<div class="controls">
<label>Radius: <span id="radiusValue">5</span> km</label>
<input type="range" id="radius" min="1" max="15" value="5">

<select id="cuisine">
  <option value="">Alle Küchen</option>
  <option value="Italienisch">Italienisch</option>
  <option value="Griechisch">Griechisch</option>
  <option value="Asiatisch">Asiatisch</option>
  <option value="Burger">Burger</option>
  <option value="Deutsch">Deutsch</option>
</select>

<button id="loadBtn">Restaurants laden</button>
<button id="recommendBtn">🎲 Neue Empfehlung</button>
</div>

<div id="recommendation"></div>
<div id="map"></div>

<h2>🟢 Offen</h2>
<ul id="openList"></ul>

<h2>❓ Unbekannt</h2>
<ul id="unknownList"></ul>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/opening_hours/build/opening_hours.min.js"></script>
<script src="script.js"></script>
</body>
</html>
